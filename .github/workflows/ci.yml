name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Unit + integration tests
        run: pytest -q
      - name: Pipeline routing + execution tables
        run: pytest -q -s tests/test_routing.py tests/test_pipeline_eval.py
      # Grades the 50-case supervisor dataset and the pipeline's routing +
      # execution suites in one report; fails on a regression in any of them.
      - name: Evaluation suite on ADK (stub backend, hermetic)
        run: python -m evals
      - name: Evaluation suite on the native orchestrator (stub backend, hermetic)
        run: python -m evals --framework native --out evals/REPORT.native.md
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-py${{ matrix.python-version }}
          path: |
            evals/REPORT.md
            evals/REPORT.native.md

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install + type-check + build
        working-directory: frontend
        run: |
          npm ci
          npm run build
