name: Deploy demo frontend (Firebase Hosting)

# The free public demo's frontend: builds frontend/ against the API on Render
# (render.yaml) and publishes it to Firebase Hosting on the free Spark plan.
# The API redeploys itself — Render watches main — so this job only ships the
# static site. One-time setup: DEPLOYMENT.md, "Free public demo".

on:
  push:
    branches: [main]
    paths: ["frontend/**", "firebase.json", ".github/workflows/demo.yml"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: demo-frontend
  cancel-in-progress: true

jobs:
  deploy:
    # Skip (rather than fail) until the Firebase project and the API URL exist.
    if: ${{ vars.FIREBASE_PROJECT_ID != '' && vars.DEMO_API_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.DEMO_API_URL }}
        run: |
          npm ci
          npm run build

      - name: Publish to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live
