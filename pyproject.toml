[project]
name = "econ-data-agent"
version = "0.2.0"
description = "MCP server + multi-agent orchestration over FRED economic data"
requires-python = ">=3.11"
readme = "README.md"

# Runtime + dev dependencies are pinned in requirements.txt (what the README
# and CI install). This file carries project metadata and tool config only.

[tool.pytest.ini_options]
pythonpath = [".", "src", "backend"]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # mcp's own FastMCP settings class has a forward-ref `lifespan` field;
    # the warning fires only because pydantic-settings is now installed (for
    # backend/core/config.py). Not our code.
    "ignore:Field 'lifespan' has an incomplete definition:UserWarning",
    # Emitted inside google-adk itself (its AgentTool and function-declaration
    # internals), not by our code.
    "ignore:.*JSON_SCHEMA_FOR_FUNC_DECL.*:UserWarning",
    "ignore:The `plugins` argument is deprecated:DeprecationWarning",
    "ignore:SelectableGroups dict interface is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "frontend"]
# Both are import roots (see pytest pythonpath) — keeps isort's first-party
# detection stable no matter which directory ruff is invoked from.
src = ["src", "backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Deliberate: catalog data + docstring prose use characters ruff flags as
# ambiguous, and the agent packages re-export names for convenience.
"src/agents/__init__.py" = ["E402", "F401"]
"evals/__init__.py" = ["E402"]
# The demo UI puts src/ on sys.path before importing project modules.
"streamlit_app.py" = ["E402"]
# backend/app/__init__.py sets sys.path before importing core.config.
"backend/app/__init__.py" = ["E402"]
